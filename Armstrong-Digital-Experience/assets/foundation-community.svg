<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title description">
  <title id="title">Stronger Together community illustration</title>
  <desc id="description">A conceptual gold-and-black illustration of people connected around a shared light, not a photograph of an actual outreach.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1810"/>
      <stop offset=".58" stop-color="#0b0b09"/>
      <stop offset="1" stop-color="#15120b"/>
    </linearGradient>
    <radialGradient id="light">
      <stop offset="0" stop-color="#e4c15b" stop-opacity=".38"/>
      <stop offset="1" stop-color="#e4c15b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="640" rx="30" fill="url(#bg)"/>
  <circle cx="500" cy="285" r="220" fill="url(#light)"/>
  <circle cx="500" cy="285" r="125" fill="none" stroke="#d8b34e" stroke-opacity=".6" stroke-width="2"/>
  <circle cx="500" cy="285" r="154" fill="none" stroke="#d8b34e" stroke-opacity=".22" stroke-width="2" stroke-dasharray="5 13"/>
  <g fill="#e1c36e">
    <circle cx="292" cy="202" r="34"/><path d="M220 345c7-62 35-94 72-94s65 32 72 94v18H220v-18Z"/>
    <circle cx="414" cy="154" r="38"/><path d="M334 326c8-72 38-109 80-109s72 37 80 109v20H334v-20Z"/>
    <circle cx="586" cy="154" r="38"/><path d="M506 326c8-72 38-109 80-109s72 37 80 109v20H506v-20Z"/>
    <circle cx="708" cy="202" r="34"/><path d="M636 345c7-62 35-94 72-94s65 32 72 94v18H636v-18Z"/>
  </g>
  <path d="M278 412c93 58 351 58 444 0" fill="none" stroke="#d8b34e" stroke-width="3" stroke-linecap="round"/>
  <text x="500" y="482" fill="#f5edda" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="7" text-anchor="middle">STRONGER TOGETHER</text>
  <text x="500" y="523" fill="#d8b34e" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="5" text-anchor="middle">ONE COMMUNITY AT A TIME</text>
  <text x="500" y="589" fill="#aaa28e" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" text-anchor="middle">CONCEPT ART · NOT A DOCUMENTARY EVENT PHOTO</text>
</svg>
